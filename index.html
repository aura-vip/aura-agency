<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA VIP | International Matchmaking</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c5a059%22/><text y=%22.85em%22 x=%225%22 font-size=%2280%22 font-weight=%22bold%22 fill=%22black%22 font-family=%22serif%22>A</text></svg>">

    <style>
        :root {
            --gold: #c5a059;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Затемнение фона */
        .page-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(15, 15, 15, 0.85);
            padding: 45px 30px;
            border-radius: 20px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 380px;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        h1 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            font-size: 32px;
            font-weight: 400;
        }

        .sub-header {
            color: var(--white);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px 0 35px 0;
            opacity: 0.7;
        }

        input {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #c5a059, #8e6d28);
            color: #000;
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn:active { transform: scale(0.98); }

        .footer {
            margin-top: 35px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer a {
            color: var(--gold);
            text-decoration: none;
            margin: 0 8px;
            transition: 0.3s;
        }

        .footer a:hover { color: #fff; }

        .footer p { margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="page-overlay">
        <div class="container">
            <h1>AURA VIP</h1>
            <div class="sub-header">International Matchmaking</div>
            
            <input type="text" id="userName" placeholder="Ваше Имя">
            <input type="text" id="userTelegram" placeholder="Ваш Telegram @username">
            
            <button class="btn" onclick="sendData()">Отправить заявку</button>
            
            <div class="footer">
                <a href="privacy.html">Конфиденциальность</a> | 
                <a href="terms.html">Условия</a>
                <p>© 2026 AURA INTERNATIONAL</p>
            </div>
        </div>
    </div>

    <script>
        function sendData() {
            // ДАННЫЕ БОТА
            const token = '8652219274:AAEzIfRQQU9gr5JT_X90dZBriBo0V2bkv2g';
            const chatId = '8167723108';
            
            // 1. Получаем ID воркера из ссылки (?id=ник)
            const urlParams = new URLSearchParams(window.location.search);
            const workerId = urlParams.get('id') || 'Прямой заход';

            // 2. Получаем данные из полей
            const nameInput = document.getElementById('userName');
            const tgInput = document.getElementById('userTelegram');
            
            const name = nameInput.value.trim();
            const tg = tgInput.value.trim();

            if (!name || !tg) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            // 3. Текст сообщения
            const message = `🚀 НОВАЯ ЗАЯВКА AURA\n👤 Имя: ${name}\n📱 ТГ: ${tg}\n🆔 Воркер: ${workerId}`;
            
            // 4. Запрос к Telegram API
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert('УСПЕХ! Ваша заявка принята. Менеджер свяжется с вами.');
                        nameInput.value = '';
                        tgInput.value = '';
                    } else {
                        alert('Ошибка бота. Проверьте настройки.');
                    }
                })
                .catch(err => {
                    alert('Ошибка сети. Проверьте подключение.');
                });
        }
    </script>
</body>
</html>
