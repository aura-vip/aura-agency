<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AURA VIP | Official Site </title>
<head>
    <meta charset="UTF-8">
    <title>AURA VIP | Official Site</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c5a059%22/><text y=%22.85em%22 x=%225%22 font-size=%2280%22 font-weight=%22bold%22 fill=%22black%22 font-family=%22serif%22>A</text></svg>">
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 320px; text-align: center; }
        h1 { color: #c5a059; margin-bottom: 5px; }
        .sub { color: #a0a0a0; font-size: 12px; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { background: #c5a059; color: black; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        footer { margin-top: 30px; font-size: 11px; color: #666; }
        footer a { color: #c5a059; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AURA</h1>
        <p class="sub">International Matchmaking</p>
        
        <input type="text" id="n" placeholder="Ваше Имя">
        <input type="text" id="t" placeholder="Ваш Telegram">
        
        <button class="btn" onclick="send()">ОТПРАВИТЬ ЗАЯВКУ</button>
    </div>

    <footer>
        <a href="privacy.html">Конфиденциальность</a> | 
        <a href="terms.html">Условия</a>
        <p>© 2026 AURA INTERNATIONAL</p>
    </footer>

    <script>
        function send() {
            // Твой рабочий токен
            const token = '8652219274:AAEzIfRQQU9gr5JT_X90dZBriBo0V2bkv2g';
            const chat = '8167723108';
            
            // Получаем данные по ID 'n' и 't'
            const nameField = document.getElementById('n');
            const tgField = document.getElementById('t');

            if (!nameField.value || !tgField.value) {
                alert('Заполните все поля!');
                return;
            }

            const message = "🚀 ЗАЯВКА AURA\nИмя: " + nameField.value + "\nТГ: " + tgField.value;
            const url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat + "&text=" + encodeURIComponent(message);

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert('УСПЕХ! Бот получил сообщение!');
                    } else {
                        alert('Ошибка бота: ' + data.description);
                    }
                })
                .catch(err => {
                    alert('Ошибка сети! Проверь интернет.');
                });
        }
    </script>
</body>
</html>
